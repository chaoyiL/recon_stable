# 相机与采集
camera:
  device: 2
  exposure: 130
  white_balance_temperature: 4600
  width: null
  height: null

capture:
  save: ~/recon_stable/assets/cali_norm_pics
  video_save: ~/recon_stable/assets/cali_lightfield_videos

calibration:
  board_type: circles
  circle_pattern: asymmetric
  board_cols: 4
  board_rows: 5
  square_size_mm: 35
  min_samples: 12
  max_view_error_px: 1.0
  outlier_sigma: 2.5
  outlier_max_rounds: 5
  output: ~/recon_stable/assets/camera_calibration.yaml

# get-surface 和图片标定使用 marker 黑框内部区域。
get_surface:
  # 黑框内部轮廓提供曲面有效域；整体 XYZ 由十字标记和双三次曲面产生。
  overall_reconstruction:
    provider: marker_bicubic
    config_file: reconstruction/surface_reconstruction/config.json
    row_direction: auto

# 三套网格共用冻结参考弧长图；coordinates 为反解的原生材料参数，st 为规则弧长坐标。
material_coordinates:
  geometry:
    rows: 120
    columns: 52
  lightfield:
    rows: 120
    columns: 52
  observation:
    rows: 400
    columns: 143

# 默认保留外部样本模式。使用图片时设 input_mode: images，并填写本次底色和几何参数。
normal_calibration:
  input_mode: images
  images: ["assets/cali_norm_pics/*.png"]
  reference_image: assets/reference.png
  sphere_radius_mm: 3
  sphere_side: positive_normal
  boundary_model: zero_boundary_displacement
  annotations_file: assets/normal_calibration/manual_regions.yaml
  work_dir: assets/normal_calibration
  input_file: assets/normal_calibration/normal_samples.npz
  output: ~/recon_stable/assets/normal_calibration/normal_lut.npz
  lut_size: 64
  maximum_rms_angle_degrees: 5.0
  checks:
    background_max_abs: 0.1
    background_min_fraction: 0.1
    validation_fraction: 0.2
    validation_rms_degrees: 20.0
    maximum_out_of_range_fraction: 0.05

reconstruction:
  reference_image: assets/reference.png
  # 图片法向标定通过后，根据本批 reference 自动重建此网格。
  material_grid_file: assets/normal_calibration/lut_material_grid.npz
  # NPZ 保存到 output_dir/pc，预览图片直接保存到 output_dir。
  output_dir: assets/reconstruction
  # 求解网格按当前整体曲面的实际长宽配比，长边点数取 observation 的较大维度。
  match_surface_aspect: true

local_reconstruction:
  calibration_file: ~/recon_stable/assets/normal_calibration/normal_lut.npz
  input_file: null
  output_file: null
  zero_color_protection:
    # 半径填绝对值。正方向：<=0.08 归零，>=0.15 恢复完整坡度。
    inner_radius: 0.08
    outer_radius: 0.15
    # 负方向：>=-0.03 归零，<=-0.08 恢复完整坡度，中间平滑过渡。
    negative_inner_radius: 0.03
    negative_outer_radius: 0.08
    # RGB 同时有正负时取较大的响应。四个半径均为 0 时关闭整层保护。
  no_contact_constraints:
    enabled: true
    minimum_startup_valid_fraction: 0.8
    minimum_channel_scale: 0.005
    trusted_score_threshold: 2.5
    contact_guard_score_threshold: 5.0
    contact_guard_radius_pixels: 20
    surface_edge_margin_pixels: 4
    slope_confidence: 1.0
    displacement_zero_lambda_per_mm2: 0.25
  spectral_poisson_initialization_iterations: 2
  linear_solver: spectral_pcg
  lsmr_atol: 1.0e-6
  lsmr_btol: 1.0e-6
  lsmr_max_iterations: null
  realtime_solver_max_iterations: 50
  realtime_solver_tolerance: 1.0e-4
