# 灯带顺序：空出 → 上（左到右）→ 右（上到下）→ 下（右到左）→ 左（下到上）。
# 五项总数不超过 128；空出部分始终熄灭，四边可分别设为 0。
led_controller:
  top: 9
  right: 4
  bottom: 9
  left: 4
  skip: 1
  # 2026-11-02 实拍校正；保留四边配色，在输出 PWM 时衰减蓝通道。
  brightness: 30
  rgb_scale: [1.0, 1.0, 0.35]

# 相机与采集
camera:
  device: 2
  exposure: 20
  white_balance_temperature: 6500
  width: 640
  height: 480
  fourcc: YUYV
  backlight_compensation: 0

capture:
  # 图片保存 float32 线性 RGB NPZ；录像保存逐帧 NPZ 和 manifest.json。
  save: ~/recon_stable/assets/cali_norm_pics
  video_save: ~/recon_stable/assets/cali_lightfield_videos

calibration:
  board_type: circles
  circle_pattern: asymmetric
  board_cols: 4
  board_rows: 5
  square_size_mm: 35
  min_samples: 12
  max_view_error_px: 1.0
  outlier_sigma: 2.5
  outlier_max_rounds: 5
  output: ~/recon_stable/assets/camera_calibration.yaml

# get-surface 和图片标定使用 marker 黑框内部区域。
get_surface:
  # 黑框内部轮廓提供曲面有效域；整体 XYZ 由十字标记和双三次曲面产生。
  overall_reconstruction:
    provider: marker_bicubic
    config_file: reconstruction/surface_reconstruction/config.json
    row_direction: auto

# 接触面相对 marker 曲面沿模板 X×Y 法向的有符号距离，单位 mm。
# 标定和完整重建共用；独立整体重建默认输出 marker 曲面。
contact_surface:
  offset_mm: 7.0
  # 从 marker 外推接缝向两侧过渡的半宽，单位 mm。高斯标准差为半宽的 1/4，0 关闭平滑。
  curvature_smoothing_half_width_mm: 2.0

# 三套网格共用冻结参考弧长图；coordinates 为反解的原生材料参数，st 为规则弧长坐标。
material_coordinates:
  geometry:
    rows: 120
    columns: 52
  lightfield:
    rows: 120
    columns: 52
  observation:
    rows: 400
    columns: 143

# 图片模式读取线性 NPZ；历史相机 PNG 仅在统一读取入口解码。
normal_calibration:
  # 同时决定生成方法和重建读取的方法：table / mlp3 / mlp5 / mlp6 / mlp8。
  # mlp3: ΔRGB；mlp5: ΔRGB + st；mlp6: ΔRGB + 曲率；mlp8: ΔRGB + st + 曲率。
  # 曲率分量为整体基准面局部切基下的 k11、k12、k22，单位 mm⁻¹。
  method: table
  lut_dir: lut
  input_mode: images
  images: ["assets/cali_norm_pics/*.npz"]
  reference_image: assets/reference.npz
  sphere_radius_mm: 4
  sphere_side: positive_normal
  boundary_model: zero_boundary_displacement
  annotations_file: assets/normal_calibration/manual_regions.yaml
  # 原图中接触轮廓向外扩张的像素半径，用于背景检查与光场训练采样。
  background_contact_exclusion_margin_px: 40
  work_dir: assets/normal_calibration/black_frame
  input_file: assets/normal_calibration/black_frame/normal_samples.npz
  lut_size: 64
  maximum_rms_angle_degrees: 5.0
  mlp:
    seed: 42
    epochs: 200
    patience: 20
    learning_rate: 0.001
    batch_size: 1024
    # 仅从外层训练图片中划出早停开发集。
    validation_fraction: 0.2
  checks:
    background_max_abs: 0.1
    background_min_fraction: 0.1
    validation_fraction: 0.2
    validation_rms_degrees: 20.0
    maximum_out_of_range_fraction: 0.05
    # 逐图最多允许 5% 的标签点缺少模型支持；误差仍统计全部标签点。
    maximum_unsupported_fraction: 0.05

# 按位移图中从上到下（网格行、列排序）配置各压痕对应的真实球半径，单位 mm。
indentation_analysis:
  sphere_radii_mm: [2.0, 1.5, 1.0]
  depth_scan:
    step_mm: 0.02
    min_fit_points: 100
    stable_steps: 5
    rmse_atol_mm: 0.005
    rmse_rtol: 0.01

reconstruction:
  reference_image: assets/reference.npz
  # 模型与材料网格按 normal_calibration.method 从 lut/ 的同一版本读取。
  # 重建结果 NPZ 保存到 output_dir/pc，完整重建的预览 PNG 保存到 assets/reconstruction/pics。
  output_dir: assets/reconstruction
  # 求解网格按当前整体曲面的实际长宽配比，长边点数取 observation 的较大维度。
  match_surface_aspect: true

local_reconstruction:
  input_file: null
  output_file: null
  zero_color_protection:
    # 半径填绝对值。正方向：<=0.08 归零，>=0.15 恢复完整坡度。
    inner_radius: 0.08
    outer_radius: 0.15
    # 负方向：>=-0.03 归零，<=-0.08 恢复完整坡度，中间平滑过渡。
    negative_inner_radius: 0.03
    negative_outer_radius: 0.08
    # RGB 同时有正负时取较大的响应。四个半径均为 0 时关闭整层保护。
  no_contact_constraints:
    enabled: true
    minimum_startup_valid_fraction: 0.8
    minimum_channel_scale: 0.005
    trusted_score_threshold: 2.5
    contact_guard_score_threshold: 5.0
    contact_guard_radius_pixels: 20
    surface_edge_margin_pixels: 4
    slope_confidence: 1.0
    displacement_zero_lambda_per_mm2: 0.25
  spectral_poisson_initialization_iterations: 2
  linear_solver: spectral_pcg
  lsmr_atol: 1.0e-6
  lsmr_btol: 1.0e-6
  lsmr_max_iterations: null
  realtime_solver_max_iterations: 50
  realtime_solver_tolerance: 1.0e-4
