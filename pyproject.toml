[project]
name = "recon"
version = "0.1.0"
description = "Marker-based overall and color-difference local surface reconstruction"
requires-python = ">=3.10"
dependencies = [
    "jax[cuda12]>=0.4.30",
    "matplotlib>=3.8",
    "numpy>=1.24",
    "opencv-python>=4.8.0",
    "Pillow>=10",
    "PyQt5>=5.15",
    "pyserial>=3.5",
    "pyyaml>=6.0.3",
    "scipy>=1.15.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "utils",
    "calibrate",
    "calibrate.utils",
    "reconstruction",
    "reconstruction.surface_reconstruction",
    "hardware",
    "experiments",
    "experiments.lut_quality",
    "experiments.indentation_analysis",
]
py-modules = ["capture"]

[tool.setuptools.package-data]
"reconstruction.surface_reconstruction" = ["config.json", "data/*.npz", "data/*.csv"]

[project.scripts]
capture = "capture:main"
calibrate-camera = "calibrate.calibrate_camera:main"
get-surface = "reconstruction.get_surface:main"
calibrate-norm = "calibrate.calibrate_norm:main"
recon = "reconstruction.recon:main"
local-recon = "reconstruction.local_recon:local_main"
recon-local = "reconstruction.local_recon:local_main"
lut-quality = "experiments.lut_quality.runner:main"
